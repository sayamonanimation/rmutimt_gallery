; ค่าตั้งต้นของ PHP สำหรับโฮสที่รัน PHP แบบ CGI/FastCGI (InfinityFree, cPanel ส่วนใหญ่)
; .htaccess php_value ใช้ไม่ได้กับ PHP แบบนี้ ต้องใช้ .user.ini แทน
; หลังแก้ค่า เซิร์ฟเวอร์อาจใช้เวลาสักครู่ (มักไม่เกิน 5 นาที) กว่าจะมีผล

upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M
