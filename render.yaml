# Render Blueprint – deploy อัตโนมัติจาก repo นี้
# ใช้: push repo ขึ้น GitHub -> render.com -> New -> Blueprint -> เลือก repo
services:
  - type: web
    name: rmutimt-gallery
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /index.php
    envVars:
      - key: DATABASE_URL
        sync: false          # กรอกใน dashboard: Session pooler URI ของ Supabase
      - key: OD_USERNAME
        sync: false
      - key: OD_PASSWORD
        sync: false
      - key: OD_FOLDER_ID
        sync: false
      - key: OD_API_BASE
        value: https://dev.opendrive.com/api/v1
    # หมายเหตุ: plan ฟรีของ Render ไม่รองรับดิสก์ถาวร -> รูปโปรไฟล์ใน uploads/
    # จะหายเมื่อ redeploy/restart  (ไฟล์ผลงานหลักไม่กระทบ เพราะอยู่บน OpenDrive)
    # ถ้าต้องการดิสก์ถาวร ให้เปลี่ยนเป็น plan: starter แล้วเพิ่มบล็อก disk: ด้านล่าง
    # disk:
    #   name: uploads
    #   mountPath: /var/www/html/uploads
    #   sizeGB: 1
